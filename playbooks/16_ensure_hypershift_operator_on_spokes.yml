---
- name: Wait for RHACM HyperShift add-on and operator on Site-A and Site-B
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Extract current spoke kubeconfigs from the RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p {{ site_a_kubeconfig_file | dirname }} {{ site_b_kubeconfig_file | dirname }}

        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ bm_cluster_name }} \
          get secret {{ bm_cluster_name }}-admin-kubeconfig \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ site_a_kubeconfig_file | quote }}
        chmod 0600 {{ site_a_kubeconfig_file | quote }}

        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ site_b_cluster_name }} \
          get secret {{ site_b_cluster_name }}-admin-kubeconfig \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ site_b_kubeconfig_file | quote }}
        chmod 0600 {{ site_b_kubeconfig_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait for HyperShift add-on, CRDs and operator on each hosting cluster
      ansible.builtin.shell: |
        set -euo pipefail

        label={{ item.name | quote }}
        cluster={{ item.cluster_name | quote }}
        spoke_kubeconfig={{ item.kubeconfig_file | quote }}
        hub_kubeconfig={{ hub_kubeconfig | quote }}
        addon={{ mce_hypershift_addon_name | default('hypershift-addon') | quote }}
        addon_namespace={{ mce_hypershift_addon_work_namespace | default('open-cluster-management-agent-addon-discovery') | quote }}
        timeout={{ hcp_hypershift_addon_wait_timeout_seconds | default(1800) | int }}
        poll={{ hcp_hypershift_addon_wait_poll_seconds | default(15) | int }}
        start=$(date +%s)
        last_report=0

        echo "# ${label}: validating spoke kubeconfig"
        server=$(oc --kubeconfig "$spoke_kubeconfig" whoami --show-server)
        version=$(oc --kubeconfig "$spoke_kubeconfig" get clusterversion version -o jsonpath='{.status.desired.version}')
        nodes=$(oc --kubeconfig "$spoke_kubeconfig" get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ')
        echo "${label}: server=${server} version=${version} nodes=${nodes}"

        if [[ "$server" != *"api.${cluster}.{{ base_domain }}"* ]]; then
          echo "ERROR: ${label} kubeconfig points to the wrong API server: ${server}" >&2
          echo "Expected api.${cluster}.{{ base_domain }}" >&2
          exit 1
        fi

        echo "# ${label}: ensure the add-on target namespace exists"
        oc --kubeconfig "$spoke_kubeconfig" create namespace "$addon_namespace" \
          --dry-run=client -o yaml | oc --kubeconfig "$spoke_kubeconfig" apply -f -

        # Touch the hub resources after the target namespace exists so the add-on
        # controller and ManifestWork controller promptly reconcile stale work.
        retry_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        oc --kubeconfig "$hub_kubeconfig" -n "$cluster" annotate \
          managedclusteraddon "$addon" "openshift-lab/retry-at=${retry_at}" \
          --overwrite >/dev/null 2>&1 || true
        oc --kubeconfig "$hub_kubeconfig" -n "$cluster" annotate \
          manifestwork "addon-${addon}-deploy-0" "openshift-lab/retry-at=${retry_at}" \
          --overwrite >/dev/null 2>&1 || true

        addon_condition() {
          local condition="$1"
          oc --kubeconfig "$hub_kubeconfig" -n "$cluster" \
            get managedclusteraddon "$addon" \
            -o jsonpath="{.status.conditions[?(@.type=='${condition}')].status}" \
            2>/dev/null || true
        }

        hypershift_ready() {
          oc --kubeconfig "$spoke_kubeconfig" \
            get crd hostedclusters.hypershift.openshift.io \
                    nodepools.hypershift.openshift.io >/dev/null 2>&1 && \
          oc --kubeconfig "$spoke_kubeconfig" -n hypershift \
            get deployment operator >/dev/null 2>&1 && \
          [[ "$(oc --kubeconfig "$spoke_kubeconfig" -n hypershift \
            get deployment operator -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)" =~ ^[1-9][0-9]*$ ]]
        }

        print_diagnostics() {
          echo
          echo "===== ${label} HyperShift add-on diagnostics ====="
          echo "# ManagedClusterAddOn"
          oc --kubeconfig "$hub_kubeconfig" -n "$cluster" \
            get managedclusteraddon "$addon" -o wide || true
          oc --kubeconfig "$hub_kubeconfig" -n "$cluster" \
            get managedclusteraddon "$addon" -o json 2>/dev/null | \
            jq -r '.status.conditions[]? | [.type,.status,.reason,.message] | @tsv' || true

          echo "# ManifestWork"
          oc --kubeconfig "$hub_kubeconfig" -n "$cluster" \
            get manifestwork "addon-${addon}-deploy-0" -o json 2>/dev/null | \
            jq -r '.status.conditions[]? | [.type,.status,.reason,.message] | @tsv' || true

          echo "# Spoke add-on namespace"
          oc --kubeconfig "$spoke_kubeconfig" -n "$addon_namespace" \
            get deployment,pod,job,serviceaccount 2>/dev/null || true

          echo "# HyperShift namespace"
          oc --kubeconfig "$spoke_kubeconfig" -n hypershift \
            get deployment,pod 2>/dev/null || true

          echo "# Recent spoke warnings"
          oc --kubeconfig "$spoke_kubeconfig" get events -A \
            --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -30 || true
          echo "=================================================="
          echo
        }

        echo "# ${label}: waiting for RHACM hypershift-addon and HyperShift operator"
        while true; do
          now=$(date +%s)
          elapsed=$((now - start))
          available=$(addon_condition Available)
          degraded=$(addon_condition Degraded)
          progressing=$(addon_condition Progressing)

          if [[ "$available" == "True" ]] && hypershift_ready; then
            echo "${label}: hypershift-addon Available=True and HyperShift operator is ready after ${elapsed}s."
            oc --kubeconfig "$spoke_kubeconfig" \
              get crd hostedclusters.hypershift.openshift.io nodepools.hypershift.openshift.io
            oc --kubeconfig "$spoke_kubeconfig" -n hypershift get deployment,pods
            exit 0
          fi

          printf '[%s] %s elapsed=%ss addon Available=%s Degraded=%s Progressing=%s operator=%s\n' \
            "$(date '+%Y-%m-%d %H:%M:%S')" "$label" "$elapsed" \
            "${available:-Unknown}" "${degraded:-Unknown}" "${progressing:-Unknown}" \
            "$(hypershift_ready && echo ready || echo waiting)"

          if (( elapsed >= timeout )); then
            echo "ERROR: ${label} HyperShift add-on/operator did not become ready within ${timeout}s." >&2
            print_diagnostics
            exit 1
          fi

          if (( elapsed - last_report >= 120 )); then
            print_diagnostics
            last_report=$elapsed
          fi

          sleep "$poll"
        done
      args:
        executable: /bin/bash
      loop:
        - name: Site-A
          cluster_name: "{{ bm_cluster_name }}"
          kubeconfig_file: "{{ site_a_kubeconfig_file }}"
        - name: Site-B
          cluster_name: "{{ site_b_cluster_name }}"
          kubeconfig_file: "{{ site_b_kubeconfig_file }}"
      loop_control:
        label: "{{ item.name }}"
      register: hypershift_addon_wait
      changed_when: false

    - name: Print HyperShift add-on readiness results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ hypershift_addon_wait.results }}"
      loop_control:
        label: "{{ item.item.name }}"
