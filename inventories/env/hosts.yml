---
all:
  children:
    ansible_controller:
      hosts:
        localhost:
          ansible_connection: local
          # Use the repo virtual environment when it is active. This keeps Ubuntu
          # 24.04 Python packages isolated from the system Python.
          ansible_python_interpreter: "{{ lookup('env', 'VIRTUAL_ENV') + '/bin/python3' if lookup('env', 'VIRTUAL_ENV') else '/usr/bin/python3' }}"
    windows_dns:
      hosts:
        windows_dns_server:
          ansible_host: "{{ ad_dns_server }}"
          ansible_connection: "{{ ad_dns_connection }}"
          ansible_winrm_transport: "{{ ad_dns_winrm_transport }}"
          ansible_port: "{{ ad_dns_port }}"
          ansible_winrm_server_cert_validation: "{{ ad_dns_server_cert_validation }}"
          ansible_user: "{{ vault_ad_username }}"
          ansible_password: "{{ vault_ad_password }}"
