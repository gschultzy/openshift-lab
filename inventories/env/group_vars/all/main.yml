# ---------------------------------------------------------------------------
# Portworx Enterprise with dedicated Pure FlashArray per hosting site
# ---------------------------------------------------------------------------
# Site-A and Site-B are independent Portworx clusters. Each target cluster must
# receive a px-pure-secret containing only the FlashArray assigned to that site.
# Do not place both standalone arrays in one pure.json unless the arrays are an
# intentionally configured FlashArray ActiveCluster pair.
portworx_pure_policy_namespace: portworx-pure-policies
portworx_pure_policy_remediation_action: enforce
portworx_pure_policy_rendered_dir: "{{ build_root }}/portworx-pure-policies"
portworx_pure_policy_cluster_label_key: portworx-pure-site
portworx_pure_tolerate_unreachable: false
# Optional site selector used by the token and policy playbooks. Empty means both.
portworx_pure_site_filter: ""

# Script/playbook switches. Node prep can be applied without array API tokens.
portworx_pure_apply_node_prep: true
portworx_pure_apply_operator: true
portworx_pure_apply_storagecluster: true

# Portworx Operator / StorageCluster settings shared by both sites.
portworx_namespace: portworx
portworx_operatorgroup_name: portworx-operator-group
portworx_subscription_name: portworx-certified
portworx_operator_package_name: portworx-certified
portworx_operator_channel: stable
portworx_operator_source: certified-operators
portworx_operator_source_namespace: openshift-marketplace
portworx_storagecluster_name: px-cluster-flasharray
# Portworx Enterprise 3.6.1.1 requires Operator 26.2.0 or later.
portworx_minimum_operator_version: "26.2.0"
portworx_install_source: "https://install.portworx.com/3.6?operator=true&mc=false&kbver=1.31.0&ns=portworx&b=true&kvdbtls=true&certmgr=true&iop=6&s=%22size%3D2000%22&j=size%3D3&pureSanType=FC&ce=pure&dmthin=true&r=17001&c=px-cluster-eb3d29ae-abcb-4581-90bd-4164cc3cbe23&osft=true&stork=true&csi=true&mon=true&aut=false&tel=true&st=k8s"
portworx_image: docker.io/portworx/oci-monitor:3.6.1.1
portworx_start_port: 17001
portworx_cloud_drive_size_gb: 2000
portworx_journal_device_size_gb: 3
# Optional complete cloud-drive strings. Leave empty to build size=<GB>.
portworx_cloud_drive_spec: ""
portworx_journal_device_spec: ""
portworx_default_io_profile: "6"
portworx_misc_args: " -T px-storev2 "
portworx_kvdb_enable_tls: true
portworx_cert_manager_enabled: true
portworx_kube_datastore_enabled: true
portworx_enable_stork: true
portworx_enable_csi: true
portworx_enable_telemetry: true
portworx_prometheus_export_metrics: true
portworx_enable_openshift_console_plugin: true
portworx_openshift_console_plugin_name: portworx
portworx_pure_san_type: FC
# Enable iscsid only when changing portworx_pure_san_type to iSCSI.
portworx_pure_enable_iscsid: false

# Portworx Enterprise 3.6.1.1 is pinned by this lab. The OpenShift baseline is
# intentionally held at 4.21 for the RHACM 2.16 / MCE 2.11 / HCP design.

# Site-A FlashArray: only Site-A nodes should be FC-zoned and registered here.
site_a_pure_flasharray_name: SV16-X90R4-B10-01
site_a_pure_flasharray_mgmt_endpoint: "10.23.74.50"
site_a_pure_flasharray_ct0_endpoint: "10.23.74.51"
site_a_pure_flasharray_ct1_endpoint: "10.23.74.52"
site_a_pure_flasharray_file_vip: "10.23.74.55"
site_a_pure_flasharray_username: pureuser
site_a_pure_flasharray_password: >-
  {{
    vault_site_a_pure_flasharray_password
    | default(vault_pure_flasharray_password | default(''), true)
  }}
site_a_pure_flasharray_api_token: >-
  {{
    vault_site_a_pure_flasharray_api_token
    | default(vault_pure_flasharray_api_token | default(''), true)
  }}
site_a_pure_flasharray_generated_token_file: "{{ build_root }}/pure/site-a-generated-flasharray-token.yml"
site_a_pure_flasharray_token_recreate: true
site_a_pure_flasharray_token_timeout: ""
site_a_pure_flasharray_realm: ""
site_a_pure_flasharray_pod: ""

# Site-B FlashArray: only Site-B nodes should be FC-zoned and registered here.
site_b_pure_flasharray_name: SV16-X20R4-B08-13
site_b_pure_flasharray_mgmt_endpoint: "10.23.74.60"
# Controller IPs/file VIP were not provided for Site-B. They are not required
# in px-pure-secret for FC; populate them only when confirmed from the array.
site_b_pure_flasharray_ct0_endpoint: ""
site_b_pure_flasharray_ct1_endpoint: ""
site_b_pure_flasharray_file_vip: ""
site_b_pure_flasharray_username: pureuser
site_b_pure_flasharray_password: >-
  {{
    vault_site_b_pure_flasharray_password
    | default(vault_pure_flasharray_secondary_password | default(''), true)
  }}
site_b_pure_flasharray_api_token: >-
  {{
    vault_site_b_pure_flasharray_api_token
    | default(vault_pure_flasharray_secondary_api_token | default(''), true)
  }}
site_b_pure_flasharray_generated_token_file: "{{ build_root }}/pure/site-b-generated-flasharray-token.yml"
site_b_pure_flasharray_token_recreate: true
site_b_pure_flasharray_token_timeout: ""
site_b_pure_flasharray_realm: ""
site_b_pure_flasharray_pod: ""

# Declarative source of truth consumed by token generation, RHACM policy
