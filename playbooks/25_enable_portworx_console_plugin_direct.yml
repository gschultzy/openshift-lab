---
- name: Ensure Portworx OpenShift console plugin is enabled on Site-A and Site-B
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate this kubeconfig is the hub, not a spoke
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: portworx_console_hub_api_server

    - name: Stop if running against Site-A or Site-B
      ansible.builtin.fail:
        msg: |
          Refusing to enable the console plugin because this kubeconfig is not {{ cluster_name }}.

          Current API server: {{ portworx_console_hub_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in portworx_console_hub_api_server.stdout"

    - name: Ensure spoke kubeconfig output directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ site_a_kubeconfig_file }}"
        - "{{ site_b_kubeconfig_file }}"

    - name: Extract Site-A admin kubeconfig from RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n {{ bm_cluster_name }} get secret {{ bm_cluster_name }}-admin-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ site_a_kubeconfig_file }}
        chmod 0600 {{ site_a_kubeconfig_file }}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Extract Site-B admin kubeconfig from RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n {{ site_b_cluster_name }} get secret {{ site_b_cluster_name }}-admin-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ site_b_kubeconfig_file }}
        chmod 0600 {{ site_b_kubeconfig_file }}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Append Portworx plugin to Site-A and Site-B console plugin lists without removing existing plugins
      ansible.builtin.shell: |
        set -euo pipefail
        K={{ item.kubeconfig | quote }}
        PLUGIN={{ portworx_openshift_console_plugin_name | default('portworx') | quote }}
        SITE={{ item.name | quote }}

        echo "# ${SITE}: current console plugins"
        CURRENT=$(oc --kubeconfig "$K" get console.operator cluster -o jsonpath='{.spec.plugins}' 2>/dev/null || true)
        echo "${CURRENT:-[]}" 

        if oc --kubeconfig "$K" get console.operator cluster -o json | jq -e --arg plugin "$PLUGIN" '(.spec.plugins // []) | index($plugin)' >/dev/null; then
          echo "${SITE}: ${PLUGIN} already present"
        else
          LEN=$(oc --kubeconfig "$K" get console.operator cluster -o json | jq '(.spec.plugins // []) | length')
          if [ "$LEN" -eq 0 ]; then
            oc --kubeconfig "$K" patch console.operator cluster --type=merge -p "{\"spec\":{\"plugins\":[\"${PLUGIN}\"]}}"
          else
            oc --kubeconfig "$K" patch console.operator cluster --type=json -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN}\"}]"
          fi
        fi

        echo
        echo "# ${SITE}: final console plugins"
        oc --kubeconfig "$K" get console.operator cluster -o jsonpath='{.spec.plugins}{"\n"}'
        echo
        echo "# ${SITE}: ConsolePlugin"
        oc --kubeconfig "$K" get consoleplugin "$PLUGIN" -o wide 2>/dev/null || true
        echo
        echo "# ${SITE}: Portworx plugin pods"
        oc --kubeconfig "$K" -n {{ portworx_namespace }} get pods 2>/dev/null | egrep -i 'NAME|px-plugin|plugin|proxy|cache' || true
      args:
        executable: /bin/bash
      loop:
        - name: Site-A
          kubeconfig: "{{ site_a_kubeconfig_file }}"
        - name: Site-B
          kubeconfig: "{{ site_b_kubeconfig_file }}"
      register: portworx_console_enable_status
      changed_when: "'patched' in portworx_console_enable_status.stdout"

    - name: Print Portworx console plugin status
      ansible.builtin.debug:
        var: portworx_console_enable_status.results | map(attribute='stdout_lines') | list
