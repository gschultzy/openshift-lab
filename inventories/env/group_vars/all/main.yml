# Safety guard for lab LVM installs. Keep false unless you are happy for LVMS to claim all unused disks.
site_a_lvm_allow_all_unused_devices: false
site_a_lvm_make_default_storageclass: true


# Portworx/Pure backed HCP storage defaults.
# Keep these explicit so hosted-cluster creation does not fall back to the older
# single-class px-fada-rwx-block-virt model.
#
# StorageClass roles:
#   vmstate                - OpenShift Virtualization vmStateStorageClass for TPM/vTPM state.
#   hcp-pxe-boot          - ALL hosted-cluster worker VM boot/root volumes.
#   hcp-pxe-data          - General-purpose additional disks exposed to tenant VMs.
#   hcp-pxe-etcd-pxfast   - Hosted control-plane etcd PVCs.
#   hcp-fada-data         - Created for future use inside tenant clusters when PX is installed there.
portworx_vmstate_storage_class: vmstate
portworx_hcp_root_volume_storage_class: hcp-pxe-boot
portworx_hcp_etcd_storage_class: hcp-pxe-etcd-pxfast
portworx_hcp_passthrough_infra_storage_class: hcp-pxe-data
portworx_hcp_guest_storage_class: hcp-pxe-data
portworx_hcp_tenant_px_storage_class: hcp-fada-data
portworx_hcp_snapshot_class: px-csi-snapclass
# Backward-compatible alias used by older playbooks. New code should use the
# role-specific variables above.
portworx_hcp_infra_storage_class: "{{ portworx_hcp_root_volume_storage_class }}"
portworx_hcp_root_volume_size: 64
portworx_hcp_root_volume_access_modes: ReadWriteMany
portworx_hcp_root_volume_volume_mode: Block
portworx_hcp_enable_root_volume_cache: false
portworx_pure_apply_hcp_storageclasses: true
portworx_hcp_boot_storage_class_is_default: true

# HCP tenant list. scripts/lib/hcp-tenants.sh reads this list directly, so tenant names,
# CIDRs, storage behavior, and RHACM ManagedCluster names are configured here.
# ManagedCluster names intentionally match HostedCluster names.
hcp_tenants:
  - site: site-a
    name: site-a-hcp-t1-px
    managed_cluster_name: site-a-hcp-t1-px
    cluster_cidr: 10.144.0.0/14
    service_cidr: 172.32.0.0/16
    enable_extra_disks: true
    tenant_px_storage_class: hcp-fada-data
    guest_storage_class: hcp-pxe-data
  - site: site-a
    name: site-a-hcp-t2-kv
    managed_cluster_name: site-a-hcp-t2-kv
    cluster_cidr: 10.148.0.0/14
    service_cidr: 172.33.0.0/16
    enable_extra_disks: false
    tenant_px_storage_class: hcp-fada-data
    guest_storage_class: hcp-pxe-data
  - site: site-b
    name: site-b-hcp-t1-px
    managed_cluster_name: site-b-hcp-t1-px
    cluster_cidr: 10.152.0.0/14
    service_cidr: 172.34.0.0/16
    enable_extra_disks: true
    tenant_px_storage_class: hcp-fada-data
    guest_storage_class: hcp-pxe-data
  - site: site-b
    name: site-b-hcp-t2-kv
    managed_cluster_name: site-b-hcp-t2-kv
    cluster_cidr: 10.156.0.0/14
    service_cidr: 172.35.0.0/16
    enable_extra_disks: false
    tenant_px_storage_class: hcp-fada-data
    guest_storage_class: hcp-pxe-data

# Default Site-A tenant values used by the HCP tenant loop.
# The create script overrides these per tenant from scripts/lib/hcp-tenants.sh.
site_a_hcp_cluster_name: "{{ hcp_tenants[0].name }}"
site_a_hcp_namespace: clusters
site_a_hcp_nodepool_replicas: 3
site_a_hcp_worker_cores: 8
site_a_hcp_worker_memory: 8Gi
site_a_hcp_release_image: "{{ bm_cluster_release_image }}"
site_a_hcp_channel: stable-4.21
site_a_hcp_pull_secret_name: openshift-pull-secret
site_a_hcp_ssh_key_name: tenant-ssh-key
site_a_hcp_machine_config_name: px-non-rotational
site_a_hcp_etcd_volume_size: 8Gi
site_a_hcp_snapshot_class: "{{ portworx_hcp_snapshot_class }}"
site_a_hcp_tenant_px_storage_class: "{{ portworx_hcp_tenant_px_storage_class }}"
site_a_hcp_extra_disk_storage_class: "{{ site_a_hcp_tenant_px_storage_class }}"
site_a_hcp_enable_extra_disks: true
site_a_hcp_extra_disks:
  - name: extra-disk-1
    size: 3Gi
  - name: extra-disk-2
    size: 64Gi
  - name: extra-disk-3
    size: 100Gi
# Guest network CIDRs. Keep these non-overlapping with the hosting clusters and each other.
# Site-A uses the proven non-overlap values that were previously only set by
# scripts/recreate-site-a-hcp-with-nonoverlap-network.sh.
site_a_hcp_cluster_cidr: "{{ hcp_tenants[0].cluster_cidr }}"
site_a_hcp_service_cidr: "{{ hcp_tenants[0].service_cidr }}"
# HCP backing storage on the Site-A hosting cluster.
# For this lab we pin HCP etcd, worker VM root volumes, and hosted-cluster storage passthrough
# to the role-specific Portworx/Pure StorageClasses below.
site_a_hcp_etcd_storage_class: "{{ portworx_hcp_etcd_storage_class }}"
site_a_hcp_root_volume_storage_class: "{{ portworx_hcp_root_volume_storage_class }}"
site_a_hcp_root_volume_size: "{{ portworx_hcp_root_volume_size }}"
site_a_hcp_root_volume_access_modes: "{{ portworx_hcp_root_volume_access_modes }}"
site_a_hcp_root_volume_volume_mode: "{{ portworx_hcp_root_volume_volume_mode }}"
site_a_hcp_enable_root_volume_cache: "{{ portworx_hcp_enable_root_volume_cache }}"
site_a_hcp_enable_storage_passthrough: true
site_a_hcp_passthrough_infra_storage_class: "{{ portworx_hcp_passthrough_infra_storage_class }}"
site_a_hcp_passthrough_guest_storage_class: "{{ portworx_hcp_guest_storage_class }}"
# Safe default: do not delete/recreate an existing hosted cluster unless explicitly requested.
site_a_hcp_recreate: false
site_a_kubeconfig_file: "{{ build_root }}/{{ bm_cluster_name }}/auth/kubeconfig"
site_a_hcp_pull_secret_file: "{{ build_root }}/site-a-hcp/pull-secret.json"
site_a_hcp_ssh_key_file: "{{ build_root }}/site-a-hcp/ssh.pub"
