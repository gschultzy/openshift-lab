---
# Generate or reuse a stable htpasswd entry for the shared lab administrator.
# The bcrypt/apr1 hash is stored in a hub-side Secret. A password checksum
# annotation prevents unnecessary hash rotation and OAuth rollouts on every run.

- name: Validate shared lab administrator inputs
  ansible.builtin.assert:
    that:
      - lab_admin_username | string | length > 0
      - lab_admin_password | string | length > 0
    fail_msg: >-
      Configure vault_cluster_admin_username and vault_cluster_admin_password in
      inventories/env/group_vars/all/vault.yml, or retain the Pod 74 lab defaults.
  no_log: true

- name: Calculate shared lab administrator password checksum
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s\0%s' "$LAB_ADMIN_USERNAME" "$LAB_ADMIN_PASSWORD" | sha256sum | awk '{print $1}'
  args:
    executable: /bin/bash
  environment:
    LAB_ADMIN_USERNAME: "{{ lab_admin_username }}"
    LAB_ADMIN_PASSWORD: "{{ lab_admin_password }}"
  register: lab_admin_password_checksum_result
  changed_when: false
  no_log: true

- name: Store desired shared lab administrator password checksum
  ansible.builtin.set_fact:
    lab_admin_password_checksum: "{{ lab_admin_password_checksum_result.stdout | trim }}"
  no_log: true

- name: Initialize existing shared administrator credential facts
  ansible.builtin.set_fact:
    lab_admin_existing_password_checksum: ""
    lab_admin_existing_htpasswd_file_b64: ""
  no_log: true

- name: Read existing hub-side shared administrator credential source
  ansible.builtin.command: >-
    oc --kubeconfig {{ hub_kubeconfig | quote }}
    -n {{ lab_admin_policy_namespace }}
    get secret {{ lab_admin_source_secret_name }} -o json
  register: lab_admin_existing_source_secret
  changed_when: false
  failed_when: false
  no_log: true

- name: Read existing shared administrator hash metadata
  ansible.builtin.set_fact:
    lab_admin_existing_password_checksum: >-
      {{
        (lab_admin_existing_source_secret.stdout | from_json)
        .get('metadata', {})
        .get('annotations', {})
        .get(lab_admin_password_checksum_annotation, '')
      }}
    lab_admin_existing_htpasswd_file_b64: >-
      {{
        (lab_admin_existing_source_secret.stdout | from_json)
        .get('data', {})
        .get('htpasswd', '')
      }}
  when:
    - lab_admin_existing_source_secret.rc == 0
    - lab_admin_existing_source_secret.stdout | trim | length > 0
  no_log: true

- name: Generate shared administrator htpasswd entry when credentials changed
  ansible.builtin.shell: |
    set -euo pipefail

    if command -v htpasswd >/dev/null 2>&1; then
      entry="$(printf '%s\n' "$LAB_ADMIN_PASSWORD" | htpasswd -niB "$LAB_ADMIN_USERNAME")"
    elif command -v openssl >/dev/null 2>&1; then
      digest="$(printf '%s\n' "$LAB_ADMIN_PASSWORD" | openssl passwd -apr1 -stdin)"
      entry="${LAB_ADMIN_USERNAME}:${digest}"
    else
      echo 'ERROR: neither htpasswd nor openssl is installed on the bastion.' >&2
      exit 1
    fi

    printf '%s\n' "$entry" | base64 -w0
  args:
    executable: /bin/bash
  environment:
    LAB_ADMIN_USERNAME: "{{ lab_admin_username }}"
    LAB_ADMIN_PASSWORD: "{{ lab_admin_password }}"
  register: lab_admin_generated_htpasswd
  changed_when: true
  when: >-
    (lab_admin_existing_password_checksum | default('')) != lab_admin_password_checksum
    or (lab_admin_existing_htpasswd_file_b64 | default('') | length == 0)
  no_log: true

- name: Select effective shared administrator htpasswd data
  ansible.builtin.set_fact:
    lab_admin_htpasswd_file_b64: >-
      {{
        lab_admin_existing_htpasswd_file_b64
        if (
          (lab_admin_existing_password_checksum | default('')) == lab_admin_password_checksum
          and (lab_admin_existing_htpasswd_file_b64 | default('') | length > 0)
        )
        else (lab_admin_generated_htpasswd.stdout | trim)
      }}
  no_log: true

- name: Ensure shared administrator policy namespace exists on hub
  ansible.builtin.shell: |
    set -euo pipefail
    oc --kubeconfig {{ hub_kubeconfig | quote }} create namespace {{ lab_admin_policy_namespace | quote }} \
      --dry-run=client -o yaml | oc --kubeconfig {{ hub_kubeconfig | quote }} apply -f -
  args:
    executable: /bin/bash
  changed_when: true

- name: Persist hub-side shared administrator credential source
  ansible.builtin.shell: |
    set -euo pipefail
    jq -n \
      --arg namespace {{ lab_admin_policy_namespace | quote }} \
      --arg name {{ lab_admin_source_secret_name | quote }} \
      --arg checksum_key {{ lab_admin_password_checksum_annotation | quote }} \
      --arg checksum "$LAB_ADMIN_PASSWORD_CHECKSUM" \
      --arg htpasswd "$LAB_ADMIN_HTPASSWD_B64" \
      '{
        apiVersion: "v1",
        kind: "Secret",
        metadata: {
          namespace: $namespace,
          name: $name,
          annotations: {($checksum_key): $checksum}
        },
        type: "Opaque",
        data: {htpasswd: $htpasswd}
      }' | oc --kubeconfig {{ hub_kubeconfig | quote }} apply -f -
  args:
    executable: /bin/bash
  environment:
    LAB_ADMIN_PASSWORD_CHECKSUM: "{{ lab_admin_password_checksum }}"
    LAB_ADMIN_HTPASSWD_B64: "{{ lab_admin_htpasswd_file_b64 }}"
  changed_when: true
  no_log: true
