---
- name: Wait for Portworx Pure node-prep MachineConfig rollout on selected sites
  hosts: localhost
  gather_facts: false
  vars:
    portworx_pure_wait_mcp_retries: "{{ lookup('env', 'PORTWORX_PURE_WAIT_MCP_RETRIES') | default('90', true) }}"
    portworx_pure_wait_mcp_delay: "{{ lookup('env', 'PORTWORX_PURE_WAIT_MCP_DELAY') | default('30', true) }}"
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate this kubeconfig is the hub
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: wait_portworx_pure_api_server

    - name: Stop if running against a spoke
      ansible.builtin.fail:
        msg: |
          Refusing to wait for Portworx node prep because this kubeconfig is not {{ cluster_name }}.
          Current API server: {{ wait_portworx_pure_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in wait_portworx_pure_api_server.stdout"

    - name: Select requested Portworx/Pure sites
      ansible.builtin.set_fact:
        portworx_pure_selected_sites: >-
          {{
            portworx_pure_sites
            if (portworx_pure_site_filter | default('') | length == 0)
            else (portworx_pure_sites | selectattr('name', 'equalto', portworx_pure_site_filter) | list)
          }}

    - name: Validate selected sites
      ansible.builtin.assert:
        that:
          - portworx_pure_selected_sites | length > 0
        fail_msg: "No Portworx site matched '{{ portworx_pure_site_filter }}'."

    - name: Ensure selected spoke kubeconfig directories exist
      ansible.builtin.file:
        path: "{{ item.kubeconfig_file | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Extract selected spoke admin kubeconfigs from the hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ item.managed_cluster }} \
          get secret {{ item.managed_cluster }}-admin-kubeconfig \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig_file | quote }}
        chmod 0600 {{ item.kubeconfig_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Wait for selected master MachineConfigPools to become healthy
      ansible.builtin.shell: |
        set -euo pipefail
        kubeconfig={{ item.kubeconfig_file | quote }}
        retries={{ portworx_pure_wait_mcp_retries | int }}
        delay={{ portworx_pure_wait_mcp_delay | int }}

        for i in $(seq 1 "$retries"); do
          echo "# {{ item.display_name }} MCP master check ${i}/${retries}"
          oc --kubeconfig "$kubeconfig" get mcp master
          conditions=$(oc --kubeconfig "$kubeconfig" get mcp master -o 'jsonpath={range .status.conditions[*]}{.type}={.status}{" "}{end}')
          echo "conditions: ${conditions}"
          if [[ "$conditions" == *"Updated=True"* ]] && \
             [[ "$conditions" == *"Updating=False"* ]] && \
             [[ "$conditions" == *"Degraded=False"* ]]; then
            echo "{{ item.display_name }} master MCP is healthy."
            exit 0
          fi
          sleep "$delay"
        done

        echo "ERROR: {{ item.display_name }} master MCP did not become healthy in time." >&2
        oc --kubeconfig "$kubeconfig" describe mcp master || true
        oc --kubeconfig "$kubeconfig" get nodes -o wide || true
        oc --kubeconfig "$kubeconfig" -n openshift-machine-config-operator get pods -o wide || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Show final MCP and node status for selected sites
      ansible.builtin.shell: |
        set -euo pipefail
        echo '# {{ item.display_name }} MCPs'
        oc --kubeconfig {{ item.kubeconfig_file | quote }} get mcp
        echo
        echo '# {{ item.display_name }} nodes'
        oc --kubeconfig {{ item.kubeconfig_file | quote }} get nodes -o wide
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"
      register: portworx_pure_node_prep_wait_status

    - name: Print final selected-site MCP/node status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ portworx_pure_node_prep_wait_status.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
