---
- name: Check site-specific Portworx Pure FlashArray policy and cluster status
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Select requested Portworx/Pure sites
      ansible.builtin.set_fact:
        portworx_pure_selected_sites: >-
          {{
            portworx_pure_sites
            if (portworx_pure_site_filter | default('') | length == 0)
            else (portworx_pure_sites | selectattr('name', 'equalto', portworx_pure_site_filter) | list)
          }}

    - name: Validate selected sites
      ansible.builtin.assert:
        that:
          - portworx_pure_selected_sites | length > 0
        fail_msg: "No Portworx site matched '{{ portworx_pure_site_filter }}'."

    - name: Ensure selected spoke kubeconfig directories exist
      ansible.builtin.file:
        path: "{{ item.kubeconfig_file | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Extract selected spoke admin kubeconfigs from RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ item.managed_cluster }} \
          get secret {{ item.managed_cluster }}-admin-kubeconfig \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig_file | quote }}
        chmod 0600 {{ item.kubeconfig_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Show hub site-specific policy status
      ansible.builtin.shell: |
        set -euo pipefail
        echo '# Managed clusters and dedicated array-placement labels'
        oc --kubeconfig {{ hub_kubeconfig | quote }} get managedcluster \
          -L {{ portworx_pure_policy_cluster_label_key }} -o wide || true
        echo
        echo '# Site-specific Portworx policies'
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ portworx_pure_policy_namespace }} \
          get policy,placement,placementdecision,placementbinding,managedclustersetbinding || true
      args:
        executable: /bin/bash
      changed_when: false
      register: portworx_pure_hub_status

    - name: Print hub policy status
      ansible.builtin.debug:
        var: portworx_pure_hub_status.stdout_lines

    - name: Check Portworx and dedicated FlashArray assignment on selected sites
      ansible.builtin.shell: |
        set -euo pipefail
        K={{ item.kubeconfig_file | quote }}
        REQUIRED={{ portworx_pure_status_require_install | default(true) | bool | lower }}

        echo '# {{ item.display_name }} expected backend'
        echo 'Array: {{ item.flasharray_name }}'
        echo 'Management endpoint: {{ item.flasharray_mgmt_endpoint }}'
        echo
        echo '# MachineConfigPools and nodes'
        oc --kubeconfig "$K" get mcp
        oc --kubeconfig "$K" get nodes -o wide
        echo
        echo '# Portworx namespace resources'
        oc --kubeconfig "$K" -n {{ portworx_namespace }} get subscription,csv,pods,storagecluster -o wide 2>/dev/null || true

        if ! oc --kubeconfig "$K" -n {{ portworx_namespace }} get secret px-pure-secret >/dev/null 2>&1; then
          echo 'px-pure-secret is not present.'
          if [ "$REQUIRED" = true ]; then
            echo 'ERROR: Full Portworx install is required but px-pure-secret is missing.' >&2
            exit 1
          fi
          echo 'Node-prep-only status requested; skipping array assignment validation.'
          exit 0
        fi

        actual_array=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get secret px-pure-secret \
          -o jsonpath='{.data.pure\.json}' | base64 -d | jq -r '.FlashArrays[].MgmtEndPoint')
        echo
        echo '# px-pure-secret endpoint validation'
        echo "Configured endpoint(s): ${actual_array}"
        if [ "$actual_array" != "{{ item.flasharray_mgmt_endpoint }}" ]; then
          echo 'ERROR: The cluster is not assigned exclusively to its expected FlashArray.' >&2
          exit 1
        fi

        if [ "$REQUIRED" = true ]; then
          phase=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get storagecluster {{ portworx_storagecluster_name }} -o jsonpath='{.status.phase}' 2>/dev/null || true)
          echo "StorageCluster phase: ${phase:-missing}"
          if [ "$phase" != Running ]; then
            echo 'ERROR: Portworx StorageCluster is not Running.' >&2
            oc --kubeconfig "$K" -n {{ portworx_namespace }} describe storagecluster {{ portworx_storagecluster_name }} || true
            exit 1
          fi
        fi

        echo
        echo '# StorageClasses'
        oc --kubeconfig "$K" get sc || true
        echo
        echo '# Console plugin'
        oc --kubeconfig "$K" get console.operator cluster -o jsonpath='{.spec.plugins}{"\n"}' 2>/dev/null || true
        oc --kubeconfig "$K" get consoleplugin {{ portworx_openshift_console_plugin_name | default('portworx') }} -o wide 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }} -> {{ item.flasharray_name }}"
      register: portworx_pure_site_status

    - name: Print selected-site Portworx/Pure status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ portworx_pure_site_status.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
