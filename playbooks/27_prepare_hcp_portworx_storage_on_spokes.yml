---
- name: Prepare Portworx/Pure storage for HCP KubeVirt on Site-A and Site-B
  hosts: localhost
  gather_facts: false
  vars:
    hcp_portworx_sites:
      - name: Site-A
        cluster_name: "{{ bm_cluster_name }}"
        kubeconfig_file: "{{ site_a_kubeconfig_file }}"
      - name: Site-B
        cluster_name: "{{ site_b_cluster_name }}"
        kubeconfig_file: "{{ site_b_kubeconfig_file }}"
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}. Run the hub install or repair-hub-kubeconfig.sh first."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Ensure spoke kubeconfig output directories exist
      ansible.builtin.file:
        path: "{{ item.kubeconfig_file | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ hcp_portworx_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Extract spoke admin kubeconfigs from RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc -n {{ item.cluster_name }} get secret {{ item.cluster_name }}-admin-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig_file }}
        chmod 0600 {{ item.kubeconfig_file }}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true
      loop: "{{ hcp_portworx_sites }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate and prepare Portworx/Pure HCP StorageClasses on each spoke
      ansible.builtin.shell: |
        set -euo pipefail
        K="{{ item.kubeconfig_file }}"
        ROOT_SC="{{ portworx_hcp_root_volume_storage_class | default('hcp-pxe-boot') }}"
        DATA_SC="{{ portworx_hcp_passthrough_infra_storage_class | default('hcp-pxe-data') }}"
        ETCD_SC="{{ portworx_hcp_etcd_storage_class | default('hcp-pxe-etcd-pxfast') }}"
        VMSTATE_SC="{{ portworx_vmstate_storage_class | default('vmstate') }}"
        TENANT_PX_SC="{{ portworx_hcp_tenant_px_storage_class | default('hcp-fada-data') }}"

        echo "# {{ item.name }} cluster and Portworx status"
        oc --kubeconfig "$K" get clusterversion

        # Portworx 3.6 annotates deployment/stork with
        # openshift.io/required-scc=hostmount-anyuid. On a clean OpenShift
        # cluster the stork service account might not yet have permission to
        # use that SCC, which prevents the ReplicaSet from creating any pods.
        # px-csi-ext uses schedulerName=stork, so this otherwise deadlocks all
        # pxd.portworx.com PVC provisioning. Grant and verify the exact SCC
        # required by the workload before waiting for CSI readiness.
        STORK_USER="system:serviceaccount:{{ portworx_namespace }}:stork"
        echo "# Ensure ${STORK_USER} can use SCC hostmount-anyuid"
        oc --kubeconfig "$K" adm policy add-scc-to-user hostmount-anyuid "$STORK_USER" >/dev/null
        if [ "$(oc --kubeconfig "$K" auth can-i use scc/hostmount-anyuid --as="$STORK_USER")" != "yes" ]; then
          echo "ERROR: ${STORK_USER} still cannot use SCC hostmount-anyuid on {{ item.name }}." >&2
          exit 1
        fi
        echo "OK: Stork SCC permission is present"

        PX_TIMEOUT={{ hcp_portworx_wait_timeout_seconds | default(3600) | int }}
        PX_POLL={{ hcp_portworx_wait_poll_seconds | default(30) | int }}
        PX_CRD=storageclusters.core.libopenstorage.org
        PX_RESOURCE=storagecluster.core.libopenstorage.org
        start=$(date +%s)
        last_detail=0

        echo "Waiting up to ${PX_TIMEOUT}s for the Portworx Operator CRD, StorageCluster and phase=Running on {{ item.name }}..."
        while true; do
          now=$(date +%s)
          elapsed=$((now - start))
          crd=absent
          object=absent
          phase=missing

          if oc --kubeconfig "$K" get crd "$PX_CRD" >/dev/null 2>&1; then
            crd=present
            if oc --kubeconfig "$K" -n {{ portworx_namespace }} get "$PX_RESOURCE" {{ portworx_storagecluster_name }} >/dev/null 2>&1; then
              object=present
              phase=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get "$PX_RESOURCE" {{ portworx_storagecluster_name }} -o jsonpath='{.status.phase}' 2>/dev/null || true)
              phase=${phase:-pending}
            fi
          fi

          printf '[%s] elapsed=%02dm%02ds crd=%s storagecluster=%s phase=%s\n' \
            "$(date '+%Y-%m-%d %H:%M:%S')" "$((elapsed/60))" "$((elapsed%60))" "$crd" "$object" "$phase"

          if [ "$crd" = present ] && [ "$object" = present ] && [ "$phase" = Running ]; then
            echo "Portworx StorageCluster is Running on {{ item.name }}."
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get "$PX_RESOURCE" {{ portworx_storagecluster_name }}
            break
          fi

          if [ "$elapsed" -ge "$PX_TIMEOUT" ]; then
            echo "ERROR: Portworx did not become ready on {{ item.name }} within ${PX_TIMEOUT}s." >&2
            echo >&2
            echo '# Portworx OLM resources' >&2
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get subscription.operators.coreos.com,clusterserviceversion.operators.coreos.com,installplan.operators.coreos.com,pods -o wide 2>&1 || true
            echo >&2
            echo '# Portworx CRDs' >&2
            oc --kubeconfig "$K" get crd 2>/dev/null | grep -E 'libopenstorage|portworx' || true
            echo >&2
            echo '# Portworx StorageCluster details' >&2
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get "$PX_RESOURCE" {{ portworx_storagecluster_name }} -o yaml 2>&1 || true
            echo >&2
            echo '# Recent Portworx events' >&2
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
            exit 1
          fi

          # Every two minutes, print enough detail to distinguish OLM delay,
          # missing CRD, policy delay and an unhealthy StorageCluster.
          if [ $((elapsed - last_detail)) -ge 120 ]; then
            last_detail=$elapsed
            echo
            echo '# Portworx progress details'
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get subscription.operators.coreos.com,clusterserviceversion.operators.coreos.com,pods -o wide 2>/dev/null || true
            if [ "$object" = present ]; then
              oc --kubeconfig "$K" -n {{ portworx_namespace }} get "$PX_RESOURCE" {{ portworx_storagecluster_name }} -o wide 2>/dev/null || true
            fi
            echo
          fi

          sleep "$PX_POLL"
        done

        echo
        echo "# Wait for Stork extender and Portworx CSI controller on {{ item.name }}"
        CSI_START=$(date +%s)
        CSI_LAST_DETAIL=0
        STORK_RESTARTED=false
        CSI_RESTARTED=false
        while true; do
          now=$(date +%s)
          csi_elapsed=$((now - CSI_START))

          stork_desired=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment stork -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
          stork_available=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment stork -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
          stork_available=${stork_available:-0}
          csi_desired=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment px-csi-ext -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
          csi_available=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment px-csi-ext -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
          csi_available=${csi_available:-0}
          stork_endpoints=$(oc --kubeconfig "$K" -n {{ portworx_namespace }} get endpoints stork-service -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)

          printf '[%s] elapsed=%02dm%02ds stork=%s/%s endpoints=%s px-csi-ext=%s/%s\n' \
            "$(date '+%Y-%m-%d %H:%M:%S')" "$((csi_elapsed/60))" "$((csi_elapsed%60))" \
            "$stork_available" "$stork_desired" "${stork_endpoints:-none}" "$csi_available" "$csi_desired"

          if [ "$stork_desired" -gt 0 ] && [ "$stork_available" -eq "$stork_desired" ] && \
             [ -n "$stork_endpoints" ] && [ "$csi_desired" -gt 0 ] && [ "$csi_available" -eq "$csi_desired" ]; then
            echo "Stork and px-csi-ext are ready on {{ item.name }}."
            break
          fi

          if [ "$stork_desired" -gt 0 ] && [ "$stork_available" -lt "$stork_desired" ] && [ "$STORK_RESTARTED" = false ]; then
            echo "Restarting deployment/stork after SCC repair..."
            oc --kubeconfig "$K" -n {{ portworx_namespace }} rollout restart deployment/stork >/dev/null
            STORK_RESTARTED=true
          fi

          if [ -n "$stork_endpoints" ] && [ "$csi_desired" -gt 0 ] && [ "$csi_available" -lt "$csi_desired" ] && [ "$CSI_RESTARTED" = false ]; then
            echo "Restarting deployment/px-csi-ext now that stork-service has endpoints..."
            oc --kubeconfig "$K" -n {{ portworx_namespace }} rollout restart deployment/px-csi-ext >/dev/null
            CSI_RESTARTED=true
          fi

          if [ "$csi_elapsed" -ge "$PX_TIMEOUT" ]; then
            echo "ERROR: Stork/px-csi-ext did not become ready on {{ item.name }} within ${PX_TIMEOUT}s." >&2
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment stork stork-scheduler px-csi-ext -o wide 2>&1 || true
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get pods -o wide 2>&1 | egrep 'stork|px-csi-ext' || true
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get endpoints stork-service -o yaml 2>&1 || true
            for rs in $(oc --kubeconfig "$K" -n {{ portworx_namespace }} get rs -l name=stork -o name 2>/dev/null); do
              oc --kubeconfig "$K" -n {{ portworx_namespace }} describe "$rs" 2>&1 | sed -n '/Events:/,$p' || true
            done
            for pod in $(oc --kubeconfig "$K" -n {{ portworx_namespace }} get pod -o name 2>/dev/null | grep px-csi-ext); do
              oc --kubeconfig "$K" -n {{ portworx_namespace }} describe "$pod" 2>&1 | sed -n '/Events:/,$p' || true
            done
            exit 1
          fi

          if [ $((csi_elapsed - CSI_LAST_DETAIL)) -ge 120 ]; then
            CSI_LAST_DETAIL=$csi_elapsed
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get deployment stork stork-scheduler px-csi-ext -o wide 2>/dev/null || true
            oc --kubeconfig "$K" -n {{ portworx_namespace }} get pods -o wide 2>/dev/null | egrep 'stork|px-csi-ext' || true
          fi

          sleep "$PX_POLL"
        done

        if ! oc --kubeconfig "$K" -n {{ portworx_namespace }} get secret px-pure-secret >/dev/null 2>&1; then
          echo "ERROR: px-pure-secret is missing on {{ item.name }} even though the StorageCluster is Running." >&2
          exit 1
        fi

        echo
        echo "# {{ item.name }} stale OCM APIService check"
        stale=$(oc --kubeconfig "$K" get apiservice 2>/dev/null | egrep 'clusterview.open-cluster-management.io|v1beta1.proxy.open-cluster-management.io' | egrep 'False|ServiceNotFound' || true)
        if [ -n "$stale" ]; then
          echo "$stale"
          echo "ERROR: Stale local OCM APIService objects remain on {{ item.name }}. Run ./scripts/cleanup-stale-ocm-apis-on-spokes.sh first." >&2
          exit 1
        fi
        echo "OK: no stale clusterview/proxy APIService entries"

        echo
        echo "# Ensure {{ item.name }} HCP StorageClasses exist directly on the spoke"
        cat <<EOF | oc --kubeconfig "$K" apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: ${VMSTATE_SC}
        parameters:
          repl: "3"
          sharedv4: "true"
          sharedv4_svc_type: ClusterIP
        provisioner: pxd.portworx.com
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        ---
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: ${TENANT_PX_SC}
        parameters:
          backend: pure_block
          priority_io: high
        provisioner: pxd.portworx.com
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        ---
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: ${ROOT_SC}
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
            storageclass.kubevirt.io/is-default-virt-class: "true"
        provisioner: pxd.portworx.com
        parameters:
          priority_io: high
          repl: "2"
          nodiscard: "true"
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        ---
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: ${DATA_SC}
        provisioner: pxd.portworx.com
        parameters:
          priority_io: high
          repl: "2"
          nodiscard: "true"
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        ---
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: ${ETCD_SC}
        provisioner: pxd.portworx.com
        parameters:
          priority_io: high
          repl: "1"
          fastpath: "true"
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        EOF

        echo
        echo "# {{ item.name }} HCP StorageClass validation"
        for sc in "$ROOT_SC" "$DATA_SC" "$ETCD_SC" "$VMSTATE_SC" "$TENANT_PX_SC"; do
          for i in $(seq 1 30); do
            if oc --kubeconfig "$K" get storageclass "$sc" >/dev/null 2>&1; then
              oc --kubeconfig "$K" get storageclass "$sc"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: StorageClass $sc was not created on {{ item.name }}" >&2
              exit 1
            fi
            sleep 2
          done
        done

        echo
        echo "# Mark $ROOT_SC as the Kubernetes and OpenShift Virtualization default class"
        for existing in $(oc --kubeconfig "$K" get sc -o name); do
          oc --kubeconfig "$K" annotate "$existing" storageclass.kubernetes.io/is-default-class- --overwrite >/dev/null 2>&1 || true
          oc --kubeconfig "$K" annotate "$existing" storageclass.kubevirt.io/is-default-virt-class- --overwrite >/dev/null 2>&1 || true
        done
        oc --kubeconfig "$K" annotate sc "$ROOT_SC" storageclass.kubernetes.io/is-default-class="true" --overwrite
        oc --kubeconfig "$K" annotate sc "$ROOT_SC" storageclass.kubevirt.io/is-default-virt-class="true" --overwrite

        echo
        echo "# Patch StorageProfiles for HCP/KubeVirt usage"
        patch_profile() {
          local sc="$1"
          local modes="$2"
          local volume_mode="$3"
          local patch
          if oc --kubeconfig "$K" get storageprofile "$sc" >/dev/null 2>&1; then
            patch=$(jq -nc --argjson modes "$modes" --arg volume_mode "$volume_mode" '{spec:{claimPropertySets:[{accessModes:$modes,volumeMode:$volume_mode}]}}')
            oc --kubeconfig "$K" patch storageprofile "$sc" --type=merge -p "$patch"
          else
            echo "WARNING: StorageProfile $sc does not exist yet. CDI normally creates it automatically after the StorageClass appears."
          fi
        }
        patch_profile "$ROOT_SC" '["ReadWriteMany"]' Block
        patch_profile "$DATA_SC" '["ReadWriteMany"]' Block
        patch_profile "$VMSTATE_SC" '["ReadWriteMany"]' Filesystem

        echo
        echo "# Patch HyperConverged vmStateStorageClass"
        if oc --kubeconfig "$K" -n {{ site_a_virt_namespace }} get hyperconverged kubevirt-hyperconverged >/dev/null 2>&1; then
          hc_patch=$(jq -nc --arg sc "$VMSTATE_SC" '{spec:{vmStateStorageClass:$sc}}')
          oc --kubeconfig "$K" -n {{ site_a_virt_namespace }} patch hyperconverged kubevirt-hyperconverged --type=merge -p "$hc_patch"
        else
          echo "WARNING: HyperConverged/kubevirt-hyperconverged not found yet. The RHACM virtualization policy will set vmStateStorageClass."
        fi

        echo
        echo "# Final {{ item.name }} StorageClass and StorageProfile summary"
        oc --kubeconfig "$K" get sc "$ROOT_SC" "$DATA_SC" "$ETCD_SC" "$VMSTATE_SC" "$TENANT_PX_SC"
        for sc in "$ROOT_SC" "$DATA_SC" "$VMSTATE_SC"; do
          echo
          echo "## StorageProfile $sc"
          oc --kubeconfig "$K" get storageprofile "$sc" -o yaml | egrep -A8 -i 'claimPropertySets|accessModes|volumeMode' || true
        done
        echo
        echo "## HyperConverged vmStateStorageClass"
        oc --kubeconfig "$K" -n {{ site_a_virt_namespace }} get hyperconverged kubevirt-hyperconverged -o jsonpath='{.spec.vmStateStorageClass}{"\n"}' 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true
      loop: "{{ hcp_portworx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      register: hcp_portworx_storage_prepare

    - name: Print HCP Portworx storage preparation output
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ hcp_portworx_storage_prepare.results }}"
      loop_control:
        label: "{{ item.item.name }}"
