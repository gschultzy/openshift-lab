# ---------------------------------------------------------------------------
# HCP tenant authentication policy
# ---------------------------------------------------------------------------
# Applies HTPasswd OAuth to the HostedCluster resources on Site-A/Site-B.
# In HCP, OAuth configuration is synced from the hosting cluster via the
# HostedCluster resource, not by patching OAuth directly inside the guest cluster.
hcp_tenant_policy_namespace: hcp-tenant-auth-policies
hcp_tenant_policy_rendered_dir: "{{ build_root }}/hcp-tenant-auth-policies"
hcp_tenant_policy_remediation_action: enforce

# Hosting clusters that own the HostedCluster resources.
hcp_tenant_site_a_hosting_placement_name: hcp-tenant-auth-site-a-hosting
hcp_tenant_site_b_hosting_placement_name: hcp-tenant-auth-site-b-hosting
hcp_tenant_site_a_hosting_binding_name: hcp-tenant-auth-site-a-hosting-binding
hcp_tenant_site_b_hosting_binding_name: hcp-tenant-auth-site-b-hosting-binding
