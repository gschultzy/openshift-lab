# ---------------------------------------------------------------------------
# Portworx Enterprise with Everpure/Pure FlashArray on Site-A and Site-B
# ---------------------------------------------------------------------------
# These policies prepare the bare-metal OpenShift clusters for Portworx using
# Pure FlashArray / Everpure backed cloud drives over Fibre Channel.
# The policy is deliberately not part of the default HCP flow because the
# MachineConfig rolls/reboots the nodes.
portworx_pure_policy_namespace: portworx-pure-policies
portworx_pure_policy_placement_name: portworx-pure-placement
portworx_pure_policy_binding_name: portworx-pure-binding
portworx_pure_policy_remediation_action: enforce
portworx_pure_policy_rendered_dir: "{{ build_root }}/portworx-pure-policies"
portworx_pure_policy_cluster_label_key: portworx-pure
portworx_pure_policy_cluster_label_value: "true"
portworx_pure_managed_clusters:
  - "{{ bm_cluster_name }}"
  - "{{ site_b_cluster_name }}"
portworx_pure_managed_clustersets:
  - "{{ bm_clusterset }}"
  - "{{ site_b_clusterset }}"

# Script/playbook switches. Node prep can be applied without an API token.
# Full install requires vault_pure_flasharray_api_token.
portworx_pure_apply_node_prep: true
portworx_pure_apply_operator: true
portworx_pure_apply_storagecluster: true
portworx_pure_tolerate_unreachable: false

# Portworx Operator / StorageCluster settings.
portworx_namespace: portworx
portworx_operatorgroup_name: portworx-operator-group
portworx_subscription_name: portworx-certified
portworx_operator_package_name: portworx-certified
portworx_operator_channel: stable
portworx_operator_source: certified-operators
portworx_operator_source_namespace: openshift-marketplace
portworx_storagecluster_name: px-cluster-flasharray
# StorageCluster generated from the Portworx 3.6.1.1 KDS template.
# Keep the CR name stable so policy re-apply overwrites the same object on Site-A/Site-B.
portworx_install_source: "https://install.portworx.com/3.6?operator=true&mc=false&kbver=1.31.0&ns=portworx&b=true&kvdbtls=true&certmgr=true&iop=6&s=%22size%3D2000%22&j=size%3D3&pureSanType=FC&ce=pure&dmthin=true&r=17001&c=px-cluster-eb3d29ae-abcb-4581-90bd-4164cc3cbe23&osft=true&stork=true&csi=true&mon=true&aut=false&tel=true&st=k8s"
portworx_image: docker.io/portworx/oci-monitor:3.6.1.1
portworx_start_port: 17001
portworx_cloud_drive_size_gb: 2000
portworx_journal_device_size_gb: 3
# Optional full Portworx cloud-drive strings. Leave empty to auto-build size=<GB>.
# Examples for advanced tuning can be set in vault/main vars if needed.
# portworx_cloud_drive_spec: "size=2000"
# portworx_journal_device_spec: "size=3"
portworx_default_io_profile: "6"
portworx_misc_args: " -T px-storev2 "
portworx_kvdb_enable_tls: true
portworx_cert_manager_enabled: true
portworx_kube_datastore_enabled: true
portworx_enable_stork: true
portworx_enable_csi: true
portworx_enable_telemetry: true
portworx_prometheus_export_metrics: true
# Enable the Portworx Dynamic Plugin in the OpenShift Console on Site-A/Site-B.
# This adds the Portworx navigation item and VM/PVC/storage tabs in the OpenShift UI.
portworx_enable_openshift_console_plugin: true
portworx_openshift_console_plugin_name: portworx

# Everpure/Pure FlashArray details.
# pure.json requires an API token, not the FlashArray login password.
# Preferred flow:
#   1) Store the FlashArray login password in Ansible Vault as vault_pure_flasharray_password.
#   2) Run ./scripts/create-pure-api-token.sh to generate/rotate an API token.
#   3) Run ./scripts/run-portworx-pure-install.sh.
# You can still bypass auto-generation by setting vault_pure_flasharray_api_token directly in vault.yml.
pure_flasharray_name: SV16-X90R4-B10-01
pure_flasharray_mgmt_endpoint: "10.23.74.50"
pure_flasharray_ct0_endpoint: "10.23.74.51"
pure_flasharray_ct1_endpoint: "10.23.74.52"
# Not listed in the workbook; retain the conventional .55 placeholder until verified.
pure_flasharray_file_vip: "10.23.74.55"
pure_flasharray_username: pureuser
pure_flasharray_password: "{{ vault_pure_flasharray_password | default('') }}"
pure_flasharray_api_token: "{{ vault_pure_flasharray_api_token | default('') }}"
pure_flasharray_generated_token_file: "{{ build_root }}/pure/generated-flasharray-token.yml"
pure_flasharray_token_recreate: true
pure_flasharray_token_timeout: ""
pure_flasharray_realm: ""
pure_flasharray_pod: ""

# Second storage appliance from the Pod 74 workbook. The current Portworx policy
# templates consume only pure_flasharray_* above, so this is deliberately staged
# and disabled until the multi-array policy work is tested in the next part.
# The workbook's FC map also shows the six nodes split across both appliances;
# do not enable this until per-site/per-node array placement is designed and tested.
pure_flasharray_secondary_enabled: false
pure_flasharray_secondary_name: SV16-X20R4-B08-13
pure_flasharray_secondary_mgmt_endpoint: "10.23.74.60"
pure_flasharray_secondary_ct0_endpoint: "10.23.74.61"
pure_flasharray_secondary_ct1_endpoint: "10.23.74.62"
pure_flasharray_secondary_username: pureuser
pure_flasharray_secondary_password: "{{ vault_pure_flasharray_secondary_password | default('') }}"
pure_flasharray_secondary_api_token: "{{ vault_pure_flasharray_secondary_api_token | default('') }}"

portworx_pure_san_type: FC
# Enable iscsid only when changing portworx_pure_san_type to iSCSI.
portworx_pure_enable_iscsid: false


