---
- name: Create or rotate Everpure/Pure FlashArray API token for Portworx
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Stop if FlashArray username is missing
      ansible.builtin.fail:
        msg: "pure_flasharray_username is empty. Set it in inventories/env/group_vars/all/main.yml."
      when: pure_flasharray_username | default('') | length == 0

    - name: Stop if FlashArray password is missing
      ansible.builtin.fail:
        msg: |
          pure_flasharray_password is empty.

          Add this to inventories/env/group_vars/all/vault.yml using ansible-vault:

            vault_pure_flasharray_password: "<FLASHARRAY_LOGIN_PASSWORD>"

          Do not put the password in main.yml or git.
      when: pure_flasharray_password | default('') | length == 0

    - name: Ensure generated Pure token directory exists
      ansible.builtin.file:
        path: "{{ pure_flasharray_generated_token_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Create or rotate FlashArray API token
      purestorage.flasharray.purefa_token:
        fa_url: "{{ pure_flasharray_mgmt_endpoint }}"
        username: "{{ pure_flasharray_username }}"
        password: "{{ pure_flasharray_password }}"
        state: present
        recreate: "{{ pure_flasharray_token_recreate | default(true) | bool }}"
        timeout: "{{ pure_flasharray_token_timeout | default(omit, true) }}"
        disable_warnings: true
      register: pure_flasharray_token_result
      no_log: true

    - name: Stop if module did not return a token
      ansible.builtin.fail:
        msg: |
          The FlashArray token module did not return a token.

          This usually means a token already existed and pure_flasharray_token_recreate=false.
          Run with token recreation enabled so the new token can be captured locally:

            PURE_TOKEN_RECREATE=true ./scripts/create-pure-api-token.sh
      when: pure_flasharray_token_result.purefa_token | default('') | length == 0

    - name: Save generated FlashArray API token as a local generated vars file
      ansible.builtin.copy:
        dest: "{{ pure_flasharray_generated_token_file }}"
        mode: "0600"
        content: |
          ---
          # Generated by playbooks/22_create_pure_flasharray_api_token.yml.
          # This file is intentionally under build/ and must not be committed to git.
          pure_flasharray_api_token: "{{ pure_flasharray_token_result.purefa_token }}"
      no_log: true

    - name: Print token generation summary
      ansible.builtin.debug:
        msg:
          - "FlashArray API token created/rotated for {{ pure_flasharray_username }} on {{ pure_flasharray_mgmt_endpoint }}."
          - "Token saved locally to {{ pure_flasharray_generated_token_file }} with mode 0600."
          - "Next: run ./scripts/run-portworx-pure-install.sh"
