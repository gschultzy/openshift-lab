---
- name: Install Red Hat Advanced Cluster Management on the SNO hub
  hosts: ansible_controller
  gather_facts: false
  environment:
    KUBECONFIG: "{{ hub_kubeconfig }}"
  tasks:
    - name: Create ACM rendered directory
      ansible.builtin.file:
        path: "{{ acm_rendered_dir }}"
        state: directory
        mode: '0750'

    - name: Render ACM operator manifests
      ansible.builtin.template:
        src: "{{ repo_root }}/templates/acm/{{ item }}"
        dest: "{{ acm_rendered_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: '0600'
      loop:
        - 00-namespace.yaml.j2
        - 01-operatorgroup.yaml.j2
        - 02-subscription.yaml.j2
        - 03-multiclusterhub.yaml.j2

    - name: Apply ACM namespace, OperatorGroup, and Subscription
      ansible.builtin.command: "oc apply -f {{ acm_rendered_dir }}/{{ item }}"
      changed_when: "'created' in acm_apply.stdout or 'configured' in acm_apply.stdout"
      register: acm_apply
      loop:
        - 00-namespace.yaml
        - 01-operatorgroup.yaml
        - 02-subscription.yaml

    - name: Wait for ACM Subscription to select an installed CSV
      ansible.builtin.command: >-
        oc -n {{ acm_namespace }} get subscription {{ acm_subscription_name }}
        -o jsonpath='{.status.installedCSV}'
      register: acm_installed_csv
      changed_when: false
      retries: 80
      delay: 15
      until:
        - acm_installed_csv.rc == 0
        - acm_installed_csv.stdout | length > 0

    - name: Show selected ACM ClusterServiceVersion
      ansible.builtin.debug:
        msg: "ACM Subscription selected CSV {{ acm_installed_csv.stdout }}"

    - name: Wait for the ACM ClusterServiceVersion to succeed
      ansible.builtin.command: >-
        oc -n {{ acm_namespace }} get csv {{ acm_installed_csv.stdout }}
        -o jsonpath='{.status.phase}'
      register: acm_csv_phase
      changed_when: false
      retries: 80
      delay: 15
      until: acm_csv_phase.stdout == 'Succeeded'

    - name: Wait for MultiClusterHub CRD to appear
      ansible.builtin.command: oc get crd multiclusterhubs.operator.open-cluster-management.io
      register: mch_crd
      changed_when: false
      retries: 80
      delay: 15
      until: mch_crd.rc == 0

    - name: Create or update MultiClusterHub
      ansible.builtin.command: "oc apply -f {{ acm_rendered_dir }}/03-multiclusterhub.yaml"
      register: mch_apply
      changed_when: "'created' in mch_apply.stdout or 'configured' in mch_apply.stdout"

    - name: Show initial MultiClusterHub state
      ansible.builtin.command: >-
        oc -n {{ acm_namespace }} get mch {{ acm_multiclusterhub_name }}
        -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,AGE:.metadata.creationTimestamp
      changed_when: false
      register: mch_initial_state

    - name: Print initial MultiClusterHub state
      ansible.builtin.debug:
        var: mch_initial_state.stdout_lines

    - name: Explain live ACM wait behavior
      ansible.builtin.debug:
        msg:
          - "The runner now monitors ACM outside Ansible so progress is visible."
          - "It reports MCH conditions, CSV state, non-ready ACM/MCE pods, degraded cluster operators and recent warnings."
