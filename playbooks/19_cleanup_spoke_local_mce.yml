---
- name: Remove stale local ACM/MCE hub components from Site-A and Site-B spokes
  hosts: localhost
  gather_facts: false
  vars:
    local_mce_cleanup_spokes:
      - name: "{{ bm_cluster_name }}"
        display: Site-A
        kubeconfig: "{{ site_a_kubeconfig_file }}"
      - name: "{{ site_b_cluster_name }}"
        display: Site-B
        kubeconfig: "{{ site_b_kubeconfig_file | default(build_root + '/site-b/auth/kubeconfig') }}"
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate playbook is running against hub-sno
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: cleanup_hub_api_server

    - name: Stop if kubeconfig is not hub-sno
      ansible.builtin.fail:
        msg: |
          Refusing to clean up Site-A/Site-B from a non-hub context.

          Current API server: {{ cleanup_hub_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in cleanup_hub_api_server.stdout"

    - name: Require explicit confirmation for destructive spoke-side MCE cleanup
      ansible.builtin.fail:
        msg: |
          This cleanup removes stale spoke-side ACM/MCE hub components from Site-A and Site-B.
          It does NOT delete the RHACM agent namespaces:
            - open-cluster-management-agent
            - open-cluster-management-agent-addon
            - open-cluster-management-agent-addon-discovery

          Re-run with:
            CONFIRM_REMOVE_LOCAL_MCE=true ./scripts/cleanup-spoke-local-mce.sh
      when: lookup('env', 'CONFIRM_REMOVE_LOCAL_MCE') | lower != 'true'

    - name: Ensure spoke kubeconfig directories exist
      ansible.builtin.file:
        path: "{{ item.kubeconfig | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ local_mce_cleanup_spokes }}"

    - name: Extract spoke admin kubeconfigs from hub when secrets exist
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p "$(dirname {{ item.kubeconfig | quote }})"
        if oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ item.name | quote }} get secret {{ item.name }}-admin-kubeconfig >/dev/null 2>&1; then
          oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ item.name | quote }} get secret {{ item.name }}-admin-kubeconfig -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig | quote }}
          chmod 0600 {{ item.kubeconfig | quote }}
          echo "Extracted {{ item.display }} kubeconfig to {{ item.kubeconfig }}"
        else
          echo "No admin kubeconfig secret found for {{ item.name }}. Using existing file if present: {{ item.kubeconfig }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ local_mce_cleanup_spokes }}"
      changed_when: true

    - name: Clean stale local ACM/MCE hub components on each spoke
      ansible.builtin.shell: |
        set -euo pipefail

        K={{ item.kubeconfig | quote }}
        SPOKE={{ item.name | quote }}
        DISPLAY={{ item.display | quote }}

        if [ ! -s "$K" ]; then
          echo "ERROR: kubeconfig missing for $DISPLAY: $K" >&2
          exit 1
        fi

        echo "================================================================================"
        echo "Cleaning stale local ACM/MCE hub components from $DISPLAY ($SPOKE)"
        echo "================================================================================"
        echo "# Spoke API"
        oc --kubeconfig "$K" whoami --show-server || true
        echo

        echo "# Before cleanup - local hub/MCE objects"
        oc --kubeconfig "$K" get managedcluster -A -o wide 2>/dev/null || true
        oc --kubeconfig "$K" get multiclusterhub -A 2>/dev/null || true
        oc --kubeconfig "$K" get multiclusterengine -A 2>/dev/null || true
        oc --kubeconfig "$K" get ns | egrep '^(open-cluster-management|multicluster-engine|open-cluster-management-hub)\b' || true
        echo

        repair_dead_managedclusteraddon_conversion() {
          local crd=managedclusteraddons.addon.open-cluster-management.io
          oc --kubeconfig "$K" get crd "$crd" >/dev/null 2>&1 || return 0

          local strategy svc_ns svc_name
          strategy="$(oc --kubeconfig "$K" get crd "$crd" -o jsonpath='{.spec.conversion.strategy}' 2>/dev/null || true)"
          svc_ns="$(oc --kubeconfig "$K" get crd "$crd" -o jsonpath='{.spec.conversion.webhook.clientConfig.service.namespace}' 2>/dev/null || true)"
          svc_name="$(oc --kubeconfig "$K" get crd "$crd" -o jsonpath='{.spec.conversion.webhook.clientConfig.service.name}' 2>/dev/null || true)"

          if [ "$strategy" = "Webhook" ] && [ -n "$svc_ns" ] && [ -n "$svc_name" ]; then
            if ! oc --kubeconfig "$K" -n "$svc_ns" get svc "$svc_name" >/dev/null 2>&1; then
              echo "# Repair stale $crd conversion webhook: missing service ${svc_ns}/${svc_name}"
              oc --kubeconfig "$K" get crd "$crd" -o yaml > "/tmp/${DISPLAY}-${crd}.backup.yaml" 2>/dev/null || true
              oc --kubeconfig "$K" patch crd "$crd" --type=json \
                -p='[{"op":"replace","path":"/spec/conversion","value":{"strategy":"None"}}]' || true
            fi
          fi
        }

        finalize_namespace_if_stuck() {
          local ns="$1"
          oc --kubeconfig "$K" get ns "$ns" >/dev/null 2>&1 || return 0
          local phase
          phase="$(oc --kubeconfig "$K" get ns "$ns" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          if [ "$phase" = "Terminating" ]; then
            echo "# Force-finalizing stale local MCE namespace ${ns} on ${DISPLAY}"
            oc --kubeconfig "$K" get ns "$ns" -o json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); d.setdefault("metadata",{})["finalizers"]=[]; d.setdefault("spec",{})["finalizers"]=[]; print(json.dumps(d))' \
              | oc --kubeconfig "$K" replace --raw "/api/v1/namespaces/${ns}/finalize" -f - >/dev/null 2>&1 || true
          fi
        }

        repair_dead_managedclusteraddon_conversion

        remove_stale_local_mce_webhooks() {
          echo "# Remove stale local ACM/MCE admission webhooks that can block CR finalizer patches"
          for kind in validatingwebhookconfiguration mutatingwebhookconfiguration; do
            oc --kubeconfig "$K" get "$kind" -o json 2>/dev/null               | jq -r '.items[]?
                | select(
                    any(.webhooks[]?; ((.clientConfig.service.namespace // "")
                      | test("^(open-cluster-management|open-cluster-management-hub|multicluster-engine)$")))
                    or (.metadata.name | test("(multicluster|mce|cluster-manager|open-cluster-management)"; "i"))
                  )
                | .metadata.name'               | sort -u               | while read -r wh; do
                  [ -n "$wh" ] || continue
                  echo "Deleting stale $kind/$wh"
                  oc --kubeconfig "$K" delete "$kind" "$wh" --ignore-not-found --wait=false || true
                done
          done
        }

        remove_local_mce_crds_if_objects_still_stuck() {
          if oc --kubeconfig "$K" get multiclusterengine -A --no-headers 2>/dev/null | grep -q .; then
            echo "# MultiClusterEngine still exists after finalizer removal. Removing stale local MCE CRDs on ${DISPLAY}."
            for crd in               multiclusterengines.multicluster.openshift.io               multiclusterhubs.operator.open-cluster-management.io               managedclusteraddons.addon.open-cluster-management.io; do
              if oc --kubeconfig "$K" get crd "$crd" >/dev/null 2>&1; then
                echo "Deleting stale local CRD $crd"
                oc --kubeconfig "$K" patch crd "$crd" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                oc --kubeconfig "$K" delete crd "$crd" --ignore-not-found --wait=false || true
              fi
            done
          fi
        }

        remove_mce_and_mch_finalizers() {
          echo "# Force-remove finalizers from stale local MCH/MCE custom resources if they remain"

          if oc --kubeconfig "$K" get multiclusterengine >/dev/null 2>&1; then
            oc --kubeconfig "$K" get multiclusterengine -o json 2>/dev/null               | jq -r '.items[]?.metadata.name'               | while read -r name; do
                  [ -n "$name" ] || continue
                  echo "Patching stale MultiClusterEngine finalizers: $name"
                  oc --kubeconfig "$K" get multiclusterengine "$name" -o json | jq '{name:.metadata.name,deletionTimestamp:.metadata.deletionTimestamp,finalizers:.metadata.finalizers}' || true
                  oc --kubeconfig "$K" patch multiclusterengine "$name" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
                  oc --kubeconfig "$K" patch multiclusterengine "$name" --type=merge -p '{"metadata":{"finalizers":null}}' || true
                  oc --kubeconfig "$K" delete multiclusterengine "$name" --ignore-not-found --wait=false || true
                done
          fi

          if oc --kubeconfig "$K" get multiclusterhub -A >/dev/null 2>&1; then
            oc --kubeconfig "$K" get multiclusterhub -A -o json 2>/dev/null               | jq -r '.items[]? | [.metadata.namespace, .metadata.name] | @tsv'               | while IFS=$'\t' read -r ns name; do
                  [ -n "$ns" ] && [ -n "$name" ] || continue
                  echo "Patching stale MultiClusterHub finalizers: ${ns}/${name}"
                  oc --kubeconfig "$K" -n "$ns" patch multiclusterhub "$name" --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
                  oc --kubeconfig "$K" -n "$ns" patch multiclusterhub "$name" --type=merge -p '{"metadata":{"finalizers":null}}' || true
                  oc --kubeconfig "$K" -n "$ns" delete multiclusterhub "$name" --ignore-not-found --wait=false || true
                done
          fi
        }

        echo "# Remove local MCH/MCE custom resources if present"
        remove_stale_local_mce_webhooks
        remove_mce_and_mch_finalizers
        oc --kubeconfig "$K" delete multiclusterhub --all -A --ignore-not-found --wait=false || true
        oc --kubeconfig "$K" delete multiclusterengine --all --ignore-not-found --wait=false || true
        remove_mce_and_mch_finalizers
        remove_local_mce_crds_if_objects_still_stuck
        echo

        echo "# Remove local ACM/MCE operator subscriptions if present"
        for ns in open-cluster-management multicluster-engine; do
          oc --kubeconfig "$K" -n "$ns" delete subscription advanced-cluster-management multicluster-engine hypershift-operator --ignore-not-found 2>/dev/null || true
          oc --kubeconfig "$K" -n "$ns" delete operatorgroup --all --ignore-not-found 2>/dev/null || true
        done
        echo

        repair_dead_managedclusteraddon_conversion

        echo "# Remove stale local ACM/MCE hub namespaces only. Preserve RHACM agent namespaces."
        for ns in open-cluster-management open-cluster-management-hub multicluster-engine; do
          oc --kubeconfig "$K" delete ns "$ns" --ignore-not-found --wait=false 2>/dev/null || true
        done

        for ns in open-cluster-management open-cluster-management-hub multicluster-engine; do
          for i in $(seq 1 30); do
            oc --kubeconfig "$K" get ns "$ns" >/dev/null 2>&1 || break
            sleep 2
          done
          finalize_namespace_if_stuck "$ns"
        done
        remove_stale_local_mce_webhooks
        remove_mce_and_mch_finalizers
        remove_local_mce_crds_if_objects_still_stuck
        repair_dead_managedclusteraddon_conversion
        echo

        echo "# Remove stale local Fleet Management console plugins if they were left enabled"
        if oc --kubeconfig "$K" get console.operator.openshift.io cluster >/dev/null 2>&1; then
          current_plugins=$(oc --kubeconfig "$K" get console.operator.openshift.io cluster -o json | jq -c '.spec.plugins // []')
          new_plugins=$(printf '%s' "$current_plugins" | jq -c '[ .[] | select(test("acm|mce|multicluster|cluster-manager|search|discovery") | not) ]')
          if [ "$current_plugins" != "$new_plugins" ]; then
            oc --kubeconfig "$K" patch console.operator.openshift.io cluster --type=merge -p "{\"spec\":{\"plugins\":$new_plugins}}" || true
          else
            echo "No stale ACM/MCE console plugins found."
          fi
        fi
        echo

        echo "# Ensure RHACM agent namespaces from the real hub are still present"
        oc --kubeconfig "$K" get ns open-cluster-management-agent open-cluster-management-agent-addon open-cluster-management-agent-addon-discovery 2>/dev/null || true
        oc --kubeconfig "$K" -n open-cluster-management-agent get pods -o wide 2>/dev/null || true
        oc --kubeconfig "$K" -n open-cluster-management-agent-addon get pods -o wide 2>/dev/null || true
        oc --kubeconfig "$K" -n open-cluster-management-agent-addon-discovery get pods -o wide 2>/dev/null || true
        echo

        echo "# After cleanup trigger - local hub/MCE objects"
        oc --kubeconfig "$K" get managedcluster -A -o wide 2>/dev/null || true
        oc --kubeconfig "$K" get multiclusterhub -A 2>/dev/null || true
        oc --kubeconfig "$K" get multiclusterengine -A 2>/dev/null || true
      args:
        executable: /bin/bash
      loop: "{{ local_mce_cleanup_spokes }}"
      changed_when: true

    - name: Repair hub-side RHACM agent view after cleanup
      ansible.builtin.shell: |
        set -euo pipefail
        ./scripts/repair-site-managedcluster-agents.sh
      args:
        executable: /bin/bash
        chdir: "{{ repo_root }}"
      environment:
        HUB_KUBECONFIG: "{{ hub_kubeconfig }}"
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Re-apply hub-side HyperShift add-on integration
      ansible.builtin.include_tasks: /dev/null
      when: false

    - name: Show final hub view
      ansible.builtin.shell: |
        set -euo pipefail
        echo '# Hub managed clusters'
        oc --kubeconfig {{ hub_kubeconfig | quote }} get managedcluster -o wide
        echo
        echo '# Hub Site-A add-ons'
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ bm_cluster_name }} get managedclusteraddon || true
        echo
        echo '# Hub Site-B add-ons'
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ site_b_cluster_name }} get managedclusteraddon || true
      args:
        executable: /bin/bash
      changed_when: false
      register: cleanup_final_status

    - name: Print final status
      ansible.builtin.debug:
        var: cleanup_final_status.stdout_lines
