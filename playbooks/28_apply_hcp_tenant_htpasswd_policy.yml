---
- name: Apply RHACM policies that configure HCP tenant HTPasswd OAuth from hosting clusters
  hosts: localhost
  gather_facts: false
  vars:
    hcp_tenant_policy_templates:
      - templates/hcp-tenant-auth-policies/00-placement-and-bindings.yaml.j2
      - templates/hcp-tenant-auth-policies/01-site-a-hostedcluster-oauth-policy.yaml.j2
      - templates/hcp-tenant-auth-policies/02-site-b-hostedcluster-oauth-policy.yaml.j2
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}. Export HUB_KUBECONFIG or create the hub first."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate HCP tenant auth policy playbook is running against {{ cluster_name }}
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: hcp_tenant_auth_api_server

    - name: Stop if HCP tenant auth policy is being applied to a tenant or spoke cluster
      ansible.builtin.fail:
        msg: |
          Refusing to apply HCP tenant auth hub policy because this kubeconfig is not {{ cluster_name }}.

          Current API server: {{ hcp_tenant_auth_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in hcp_tenant_auth_api_server.stdout"

    - name: Confirm hosting ManagedClusters exist on the hub
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} get managedcluster {{ item }}
      loop: "{{ hcp_tenant_required_managed_clusters }}"
      changed_when: false

    - name: Remove old v18 tenant-targeted RBAC policy objects from the hub
      ansible.builtin.shell: |
        set -euo pipefail
        ns={{ hcp_tenant_policy_namespace | quote }}

        # v18 briefly managed tenant ClusterRoleBinding objects directly on the imported
        # HCP ManagedClusters.  HCP OAuth config should be delivered through the
        # HostedCluster resources on the hosting clusters instead, so remove that
        # tenant-targeted policy wiring.  This does not delete any live tenant
        # ClusterRoleBinding that might already have been created.
        oc -n "$ns" delete policy {{ hcp_tenant_cluster_admin_policy_name }} --ignore-not-found || true
        oc -n "$ns" delete placementbinding {{ hcp_tenant_policy_binding_name }} --ignore-not-found || true
        oc -n "$ns" delete placement {{ hcp_tenant_policy_placement_name }} --ignore-not-found || true
        oc -n "$ns" delete managedclustersetbinding {{ hcp_tenant_clusterset }} --ignore-not-found || true

        for mc in {{ hcp_tenant_managed_clusters | join(' ') }}; do
          oc label managedcluster "$mc" {{ hcp_tenant_policy_cluster_label_key }}- --overwrite >/dev/null 2>&1 || true
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Label hosting ManagedClusters for HCP tenant OAuth placement
      ansible.builtin.command: >-
        oc label managedcluster {{ item.name }}
        {{ item.label_key }}={{ item.label_value }}
        --overwrite
      loop:
        - name: "{{ bm_cluster_name }}"
          label_key: "{{ hcp_tenant_site_a_hosting_label_key }}"
          label_value: "{{ hcp_tenant_site_a_hosting_label_value }}"
        - name: "{{ site_b_cluster_name }}"
          label_key: "{{ hcp_tenant_site_b_hosting_label_key }}"
          label_value: "{{ hcp_tenant_site_b_hosting_label_value }}"
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Create rendered HCP tenant policy directory
      ansible.builtin.file:
        path: "{{ hcp_tenant_policy_rendered_dir }}"
        state: directory
        mode: "0755"

    - name: Clean rendered HCP tenant auth policy manifests from previous runs
      ansible.builtin.shell: |
        set -euo pipefail
        rm -f {{ hcp_tenant_policy_rendered_dir }}/*.yaml
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure HCP tenant auth policy namespace exists on hub
      ansible.builtin.command: oc create namespace {{ hcp_tenant_policy_namespace }} --dry-run=client -o yaml
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: false
      register: hcp_tenant_policy_namespace_manifest

    - name: Apply HCP tenant auth policy namespace on hub
      ansible.builtin.command: oc apply -f -
      args:
        stdin: "{{ hcp_tenant_policy_namespace_manifest.stdout }}"
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Render HCP tenant auth policy manifests
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ hcp_tenant_policy_rendered_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ hcp_tenant_policy_templates }}"

    - name: Validate rendered HCP tenant auth policy manifests before applying
      ansible.builtin.shell: |
        set -euo pipefail
        for f in {{ hcp_tenant_policy_rendered_dir }}/*.yaml; do
          if [ -s "$f" ] && grep -Eq '^(apiVersion|kind):' "$f"; then
            echo "Validating $f"
            oc apply --dry-run=client -f "$f" >/dev/null
          else
            echo "Skipping empty/non-manifest $f"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: false

    - name: Apply HCP tenant auth policy manifests to hub
      ansible.builtin.shell: |
        set -euo pipefail
        for f in {{ hcp_tenant_policy_rendered_dir }}/*.yaml; do
          if [ -s "$f" ] && grep -Eq '^(apiVersion|kind):' "$f"; then
            echo "Applying $f"
            oc apply -f "$f"
          else
            echo "Skipping empty/non-manifest $f"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: true

    - name: Show HCP HostedCluster OAuth policy status
      ansible.builtin.shell: |
        set -euo pipefail
        echo '# HCP hosting ManagedClusters'
        oc get managedcluster {{ bm_cluster_name }} {{ site_b_cluster_name }} -o wide
        echo
        echo '# HCP HostedCluster OAuth policies'
        oc -n {{ hcp_tenant_policy_namespace }} get managedclustersetbinding,placement,placementdecision,policy,placementbinding
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ hub_kubeconfig }}"
      changed_when: false
      register: hcp_tenant_auth_policy_status

    - name: Print HCP HostedCluster OAuth policy status
      ansible.builtin.debug:
        var: hcp_tenant_auth_policy_status.stdout_lines
