---
- name: Ensure Portworx OpenShift console plugin is enabled on selected sites
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate this kubeconfig is the hub
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: portworx_console_hub_api_server

    - name: Stop if running against a spoke
      ansible.builtin.fail:
        msg: |
          Refusing to enable the console plugin because this kubeconfig is not {{ cluster_name }}.
          Current API server: {{ portworx_console_hub_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in portworx_console_hub_api_server.stdout"

    - name: Select requested Portworx/Pure sites
      ansible.builtin.set_fact:
        portworx_pure_selected_sites: >-
          {{
            portworx_pure_sites
            if (portworx_pure_site_filter | default('') | length == 0)
            else (portworx_pure_sites | selectattr('name', 'equalto', portworx_pure_site_filter) | list)
          }}

    - name: Validate selected sites
      ansible.builtin.assert:
        that:
          - portworx_pure_selected_sites | length > 0
        fail_msg: "No Portworx site matched '{{ portworx_pure_site_filter }}'."

    - name: Ensure selected spoke kubeconfig directories exist
      ansible.builtin.file:
        path: "{{ item.kubeconfig_file | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Extract selected spoke admin kubeconfigs from RHACM hub
      ansible.builtin.shell: |
        set -euo pipefail
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ item.managed_cluster }} \
          get secret {{ item.managed_cluster }}-admin-kubeconfig \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > {{ item.kubeconfig_file | quote }}
        chmod 0600 {{ item.kubeconfig_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Append Portworx plugin without removing existing plugins
      ansible.builtin.shell: |
        set -euo pipefail
        K={{ item.kubeconfig_file | quote }}
        PLUGIN={{ portworx_openshift_console_plugin_name | default('portworx') | quote }}

        if oc --kubeconfig "$K" get console.operator cluster -o json | jq -e --arg plugin "$PLUGIN" '(.spec.plugins // []) | index($plugin)' >/dev/null; then
          echo '{{ item.display_name }}: plugin already present'
        else
          LEN=$(oc --kubeconfig "$K" get console.operator cluster -o json | jq '(.spec.plugins // []) | length')
          if [ "$LEN" -eq 0 ]; then
            oc --kubeconfig "$K" patch console.operator cluster --type=merge -p "{\"spec\":{\"plugins\":[\"${PLUGIN}\"]}}"
          else
            oc --kubeconfig "$K" patch console.operator cluster --type=json -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN}\"}]"
          fi
        fi
        oc --kubeconfig "$K" get console.operator cluster -o jsonpath='{.spec.plugins}{"\n"}'
        oc --kubeconfig "$K" get consoleplugin "$PLUGIN" -o wide 2>/dev/null || true
      args:
        executable: /bin/bash
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        label: "{{ item.display_name }}"
      register: portworx_console_enable_status
      changed_when: "'patched' in portworx_console_enable_status.stdout"

    - name: Print selected-site console plugin status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ portworx_console_enable_status.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
