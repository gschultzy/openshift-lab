---
- name: Create or rotate site-specific Pure FlashArray API tokens for Portworx
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select requested FlashArray sites
      ansible.builtin.set_fact:
        portworx_pure_selected_sites: >-
          {{
            portworx_pure_sites
            if (portworx_pure_site_filter | default('') | length == 0)
            else (
              portworx_pure_sites
              | selectattr('name', 'equalto', portworx_pure_site_filter)
              | list
            )
          }}

    - name: Validate requested FlashArray site filter
      ansible.builtin.assert:
        that:
          - portworx_pure_selected_sites | length > 0
        fail_msg: >-
          No FlashArray site matched '{{ portworx_pure_site_filter }}'.
          Valid values are: {{ portworx_pure_sites | map(attribute='name') | join(', ') }}.

    - name: Generate one API token per selected FlashArray
      ansible.builtin.include_tasks: tasks/create_pure_token_for_site.yml
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        loop_var: portworx_site
        label: "{{ portworx_site.display_name }} -> {{ portworx_site.flasharray_name }}"
