---
- name: Apply site-specific RHACM policies for Portworx Enterprise with Pure FlashArray
  hosts: localhost
  gather_facts: false
  vars:
    portworx_pure_policy_templates:
      - templates/portworx-pure-policies/00-placement-and-bindings.yaml.j2
      - templates/portworx-pure-policies/01-node-prep-policy.yaml.j2
      - templates/portworx-pure-policies/02-portworx-operator-policy.yaml.j2
      - templates/portworx-pure-policies/03-pure-secret-policy.yaml.j2
      - templates/portworx-pure-policies/04-portworx-storagecluster-policy.yaml.j2
      - templates/portworx-pure-policies/05-openshift-console-plugin-policy.yaml.j2
      - templates/portworx-pure-policies/06-hcp-storageclasses-policy.yaml.j2
  tasks:
    - name: Confirm hub kubeconfig exists
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: hub_kubeconfig_stat

    - name: Stop if hub kubeconfig is missing
      ansible.builtin.fail:
        msg: "Hub kubeconfig not found at {{ hub_kubeconfig }}. Complete or repair the hub first."
      when: not hub_kubeconfig_stat.stat.exists

    - name: Validate Portworx policy playbook is running against the hub
      ansible.builtin.command: oc --kubeconfig {{ hub_kubeconfig | quote }} whoami --show-server
      changed_when: false
      register: portworx_pure_api_server

    - name: Stop if Portworx policies are being applied to a spoke cluster
      ansible.builtin.fail:
        msg: |
          Refusing to apply RHACM Portworx policies because this kubeconfig is not {{ cluster_name }}.
          Current API server: {{ portworx_pure_api_server.stdout }}
          Expected: api.{{ cluster_name }}.{{ base_domain }}
      when: "'api.' ~ cluster_name ~ '.' ~ base_domain not in portworx_pure_api_server.stdout"

    - name: Select requested Portworx/Pure sites
      ansible.builtin.set_fact:
        portworx_pure_selected_sites: >-
          {{
            portworx_pure_sites
            if (portworx_pure_site_filter | default('') | length == 0)
            else (
              portworx_pure_sites
              | selectattr('name', 'equalto', portworx_pure_site_filter)
              | list
            )
          }}

    - name: Validate requested Portworx/Pure site filter
      ansible.builtin.assert:
        that:
          - portworx_pure_selected_sites | length > 0
        fail_msg: >-
          No Portworx site matched '{{ portworx_pure_site_filter }}'.
          Valid values are: {{ portworx_pure_sites | map(attribute='name') | join(', ') }}.

    - name: Warn that Portworx Enterprise 3.6.1.1 is a POC configuration on OpenShift 4.22
      ansible.builtin.debug:
        msg:
          - "WARNING: This lab pins Portworx Enterprise 3.6.1.1 on OpenShift {{ ocp_release_version }}."
          - "The published PE 3.6.1 support matrix lists OCP through 4.21; obtain Everpure support confirmation for OCP 4.22 before production use."
      when:
        - ocp_version == '4.22'
        - portworx_poc_allow_ocp_4_22 | default(false) | bool

    - name: Stop unsupported OCP 4.22 deployment unless POC acknowledgement is enabled
      ansible.builtin.fail:
        msg: |
          Portworx Enterprise 3.6.1.1 is not listed in the published support matrix for OpenShift 4.22.
          For a lab-only POC, set portworx_poc_allow_ocp_4_22: true in main.yml.
      when:
        - ocp_version == '4.22'
        - not (portworx_poc_allow_ocp_4_22 | default(false) | bool)

    - name: Ensure Portworx/Pure RHACM policy namespace exists
      ansible.builtin.shell: |
        set -euo pipefail
        oc --kubeconfig {{ hub_kubeconfig | quote }} create namespace {{ portworx_pure_policy_namespace }} \
          --dry-run=client -o yaml | oc --kubeconfig {{ hub_kubeconfig | quote }} apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Apply one isolated Portworx/Pure policy bundle per site
      ansible.builtin.include_tasks: tasks/apply_portworx_pure_site.yml
      loop: "{{ portworx_pure_selected_sites }}"
      loop_control:
        loop_var: portworx_site
        label: "{{ portworx_site.display_name }} -> {{ portworx_site.flasharray_name }}"

    - name: Show final Portworx/Pure RHACM policy status
      ansible.builtin.shell: |
        set -euo pipefail
        echo '# ManagedClusters and site labels'
        oc --kubeconfig {{ hub_kubeconfig | quote }} get managedcluster \
          -L {{ portworx_pure_policy_cluster_label_key }} -o wide
        echo
        echo '# Site-specific Portworx policies'
        oc --kubeconfig {{ hub_kubeconfig | quote }} -n {{ portworx_pure_policy_namespace }} \
          get policy,placement,placementdecision,placementbinding,managedclustersetbinding
      args:
        executable: /bin/bash
      changed_when: false
      register: portworx_pure_policy_status

    - name: Print Portworx/Pure policy status
      ansible.builtin.debug:
        var: portworx_pure_policy_status.stdout_lines
